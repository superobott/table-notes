plugins { id 'com.android.application' }

// Environment variables override the optional, ignored root signing.properties.
def signingProperties = new Properties()
def signingFile = rootProject.file('signing.properties')
if (signingFile.exists()) signingFile.withInputStream { signingProperties.load(it) }
def signingValue = { name -> System.getenv(name) ?: signingProperties.getProperty(name) }
def releaseValues = ['TABLE_NOTES_STORE_FILE', 'TABLE_NOTES_STORE_PASSWORD',
                     'TABLE_NOTES_KEY_ALIAS', 'TABLE_NOTES_KEY_PASSWORD'].collectEntries { [(it): signingValue(it)] }
def hasReleaseSigning = releaseValues.values().every { it != null && !it.trim().isEmpty() }

android {
    namespace 'com.nikita.restaurantjournal'
    compileSdk 35
    defaultConfig {
        applicationId 'com.nikita.restaurantjournal'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(releaseValues.TABLE_NOTES_STORE_FILE)
                storePassword releaseValues.TABLE_NOTES_STORE_PASSWORD
                keyAlias releaseValues.TABLE_NOTES_KEY_ALIAS
                keyPassword releaseValues.TABLE_NOTES_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseSigning) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
}
dependencies {
    implementation 'com.google.android.libraries.places:places:5.2.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
