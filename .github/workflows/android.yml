name: Android checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - name: Install Android packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - name: Build, lint and test backups
        run: |
          if bash ./gradlew --no-daemon --console=plain assembleDebug lintDebug testDebugUnitTest > android-checks.log 2>&1; then
            tail -n 100 android-checks.log
          else
            tail -n 160 android-checks.log
            exit 1
          fi
      - name: Save APK and verification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: table-notes-verification
          retention-days: 7
          path: |
            android-checks.log
            app/build/outputs/apk/debug/*.apk
            app/build/reports/
            app/build/test-results/

